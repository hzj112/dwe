global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: dwe-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:9091]
        labels:
          role: api
  - job_name: dwe-worker
    metrics_path: /actuator/prometheus
    # Resolve every replica separately; a single load-balanced target mixes process counters.
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
        refresh_interval: 5s
    relabel_configs:
      - target_label: role
        replacement: worker
