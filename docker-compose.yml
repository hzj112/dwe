services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dwe}
      POSTGRES_USER: ${POSTGRES_USER:-dwe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwe_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  api:
    image: dwe:0.1.0-SNAPSHOT
    build: .
    pull_policy: build
    environment: &application-environment
      SPRING_PROFILES_ACTIVE: api
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dwe}
      POSTGRES_USER: ${POSTGRES_USER:-dwe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwe_local}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 40s
    restart: unless-stopped
  worker:
    image: dwe:0.1.0-SNAPSHOT
    # Reuse the image built by api; this application is not published to a registry.
    pull_policy: never
    # Independent processes share PostgreSQL claims; each keeps its own two-handler capacity.
    deploy:
      replicas: 2
    environment:
      <<: *application-environment
      SPRING_PROFILES_ACTIVE: worker
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
